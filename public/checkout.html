<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Care4U</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/brand-overrides.css"><link rel="stylesheet" href="/logo-tuning.css"><link rel="stylesheet" href="/footer-tuning.css"></head><body><header class="site-header"><a class="logo" href="/" aria-label="Care4U home"><img src="/assets/care4u-logo-transparent.png" alt="Care4U official logo"></a><strong>Secure checkout</strong><a class="button" href="/">Continue shopping</a></header><main class="section checkout"><div class="section-heading"><div><p class="eyebrow">Complete your order</p><h1>Checkout</h1></div></div><div class="checkout-grid"><form id="checkoutForm" class="checkout-form"><input name="name" placeholder="Full name" required><input name="phone" placeholder="Pakistani phone number" required><input name="email" type="email" placeholder="Email (optional)"><input name="address" placeholder="Delivery address" required><input name="city" placeholder="City" required><input name="province" placeholder="Province"><input name="postal_code" placeholder="Postal code"><textarea name="notes" placeholder="Order notes (optional)"></textarea><select name="payment_method"><option value="cod">Cash on delivery</option></select><button class="button primary" type="submit">Place order</button><p class="error" id="checkoutError"></p></form><aside class="order-summary"><h2>Order summary</h2><div id="summary"></div></aside></div></main><script type="module" src="/checkout.js"></script></body></html>
